    code has been made.

fidelity:
  divergences: >-
    (1) A facet is given by its plane <a, x> = 1 (the origin inside makes
    this normalization possible); the Resonus plane of that facet is the set
    of translations carrying the plane into itself. (2) A ridge is entered
    through its affine span: the flat of two facet planes; for the polytope
    statement, a ridge R spans the same plane as the flat when its affine
    span is the flat (span_eq_of_affineSpan in the library). (3) In
    heart_of_symm a ridge of X is a nonempty exposed face of dimension
    finrank E - 2, and "heart kind" means the opposite of every ridge is a
    ridge; X is any set. (4) The permutohedron ridge (B1, B2, B3) is given
    by its two facet planes inside the hyperplane sum y = 0, at the
    heights of the centred permutohedron; that these are its facet planes
    is not formalized. (5) web_iff is stated for a convex, centrally
    symmetric set with interior points, a nonzero continuous functional f
    with least upper bound h on the set, and an additive subgroup as the
    lattice.

