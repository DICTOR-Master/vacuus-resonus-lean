# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Planes Through the Centre of the Permutohedron: Faces, Vacuus Plates and Their Count, in Lean"
  description: >-
    The permutohedron in R^n is the convex hull of the rearrangements of
    (n, n-1, ..., 1). This entry works with its real faces, defined from the
    polytope: for every ordered partition of the coordinates into m nonempty
    blocks it proves that the corresponding face is an exposed face of
    dimension n - m. For the ridges (m = 3, blocks of sizes a, b, c) it
    proves that the plane through the centre and the ridge is
    {y : sum y = 0, c(a+b) sum over B1 + a(b+c) sum over B3 = 0}; that two
    ridges give the same plane exactly when they are equal or reverses, or
    both have a = c and the same or complementary middle blocks; and that
    the number of distinct planes is the closed formula of OEIS A402191 for
    every n >= 3 (values 3, 15, 65, 225, 770, 2443 for n = 3 to 8). For the
    planes through the centre parallel to the facets (the resonance
    arrangement), it proves that two facets share a plane exactly when their
    sets are equal or complementary, that there are 2^(n-1) - 1 such planes,
    that each is parallel to its facet with dimension n - 2, and exactly
    which of them are also ridge planes: all of them for odd n, all but
    2^(n-2) for even n. Paper #120 calls the two families the Vacuus and the
    Resonus. The proofs build on TauCeti's formalization of Rado's theorem.
    Audience: readers of polytope geometry and Mathlib users working with
    convex sets and permutations.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"

