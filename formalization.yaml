      the face proofs use them. Not part of this entry's claims.

status:
  scope: >-
    Formalized (Challenge, 27 theorems): the faces of the permutohedron from
    ordered partitions (exposed, dimension n - m), facets and their direction
    spaces, the plane through the centre and each ridge, when two ridges
    share it, their number (closed formula, n >= 3, and n = 3 to 8), and the
    Resonus: when two facets share a plane, the number 2^(n-1) - 1,
    parallelism and dimension, and which Resonus planes are ridge planes.
    Not formalized: that every face of the permutohedron comes from an
    ordered partition (the entry proves only that these sets are exposed
    faces of the stated dimensions); Theorem 3 (v) of #120 (no plate is a
    mirror); the type-B results and the catalogue of #120.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus (Anthropic)", "Claude Fable (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code agents wrote the definitions, the statements and the
        proofs and ran the Lake builds and the comparator against Mathlib and
        TauCeti (Lean v4.37.0-rc1) on Linux compute machines. Steps 1 to 5
        (faces, ridge planes, plate coincidences) were written by the Opus
        agent; the count, the Resonus file and the packaging by a Fable
        subagent, each rebuilt and checked by the Opus agent.
      cost:
        wall_time: "about two days (26 to 27 November 2026), in milestones"
        spend_usd: "subscription-based"
        hardware: "local Linux machines"
      prompting_notes: >-
        DICTO found the results (papers #105 and #120), asked for them in Lean
        on the real polytope, and chose the title.
  spend_usd: "subscription-based"
  notes: >-
    DICTO posed the formalization and directed the work; every definition,
    statement and proof was written by the agents. Every build was checked
    by a full recompilation, #print axioms (only propext, Classical.choice
    and Quot.sound) and the lake comparator (with a negative control). No
    independent human line-by-line audit of the Lean code has been made.

fidelity:
  divergences: >-
    (1) The permutohedron P n is the convex hull of the rearrangements of
    (n, ..., 1), not centred; the centre ((n+1)/2, ...) is subtracted in
    span_centred_ridge, and all planes are stated as subspaces of the
    sum-zero space. (2) The directory Vendor/TauCeti/ contains three files
    copied from the TauCeti library (https://github.com/TauCetiProject/TauCeti,
    Apache-2.0, Copyright (c) 2026 The Tau Ceti contributors) at commit
    6d810e58e90dc1a8f89e5cb6056ee36c26da67d3:
    TauCeti/Algebra/BigOperators/Finset/PartialSum.lean,
    TauCeti/Analysis/Convex/Majorization.lean and
    TauCeti/Analysis/Convex/PermutationOrbit.lean, unchanged except for their
    import paths (TauCeti.X became Vendor.TauCeti.X) and a header comment
    recording the source; declaration names (TauCeti.*) are kept. They are
    not this entry's work: they supply Rado's theorem (prefix-sum bound and
    permutation invariance) used by the proofs. The Challenge imports only
    Mathlib; its VR.prefixSum (the sum of the first k coordinates) is a copy
    of TauCeti.prefixSum, and Solution.lean proves the copied definitions
    equal the library's (bridge_top, bridge_facet, bridge_flagFace,
    bridge_resonusSet). (3) A face is given by an ordered partition (a surjective
    key : Fin n -> Fin m) as flagFace: the points of P n where every initial
    union of blocks has the largest coordinate sum occurring on P n (top n k,
    defined with VR.prefixSum); a facet is facet S for one set S. The
    entry proves these are exposed faces of dimension n - m and n - 2; it
    does not prove that all faces arise this way, nor identify facet S with
    a two-block flagFace. (4) A ridge is the flagFace of a surjective
    key : Fin n -> Fin 3; its Vacuus plate is stated by the explicit equation
    permPlate, linked to the ridge by span_centred_ridge; plate_eq_iff,
    card_plateSet and plates_* are stated for permPlate. (5) The Resonus
    plane of facet S is its direction space vectorSpan (facet S) = dirs S;
    'through the centre, parallel to the facet' is resonus_parallel. (6)
    Counts are Set.ncard of sets of submodules; the sum in card_plateSet
    uses natural-number division of factorials (exact here).

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Every definition and statement in the Challenge is copied from the Lean
    library PermFaces (namespace VR); the Solution restates the Challenge
    and transfers each proof from the library. The comparator accepts all
    27 theorems and rejects a deliberately altered statement. Formal search
    (26 November 2026): Mathlib (no permutohedron faces), public Lean code
    for permutohedron, majorization and Rado; found TauCeti (Rado's theorem,
    used here); no earlier formalization of the ridge planes, their count or
    the resonance arrangement of the permutohedron was found.

