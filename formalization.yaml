version: "v0.4"

project:
  name: "Planes Through the Centre of a Polytope: the Polar Link, the Pencil Lemma and the Permutohedron, in Lean"
  description: >-
    For a convex polytope with the origin inside, consider two families of
    planes through the origin: the planes through each ridge (an edge in
    3-space), and the planes parallel to each facet. Paper #120 calls them
    the Vacuus and the Resonus. This entry proves in Lean that the plane
    parallel to the facet <a, x> = 1 is the orthogonal complement of a, the
    corresponding corner of the polar polytope; that the plane through a
    ridge on the facet planes <u1, y> = h1 and <u2, y> = h2 is the zero set
    of h2 u1 - h1 u2 (a standard pencil fact), so it is perpendicular to the
    polar edge; that a centrally symmetric set has its ridges in opposite
    pairs; the equation of the plane through each ridge of the
    permutohedron in every dimension; and an exact test for when the
    translates of a central plane through a lattice tiling by a centrally
    symmetric cell meet each cell only in its own central plane. The facts
    are elementary or standard; the entry gives their Lean proofs in any
    dimension. Audience: readers of polytope geometry and Mathlib users
    working with convex sets.
  authors:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "DICTO"
      orcid: "0009-0001-2620-2036"
      github: "DICTOR-Master"

